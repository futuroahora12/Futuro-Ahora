name: Compilar APK Futuro Ahora

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta web
        run: npm run copy-web

      - name: Instalar Capacitor y generar proyecto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Futuro-Ahora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
