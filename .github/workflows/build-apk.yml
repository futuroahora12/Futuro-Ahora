name: Compilar APK Futuro Ahora

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta web y descargar logo oficial
        run: |
          npm run copy-web
          mkdir -p assets
          curl -L "https://i.postimg.cc/XvVqgrJF/20261116-035439-0000.png" -o assets/logo.png

      - name: Instalar Capacitor y generar proyecto Android
        run: |
          npm install
          npm install -D @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FFFFFF'
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Futuro-Ahora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
