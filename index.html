    <!-- Script Principal Unificado: Login + Dashboard, PIN 4 Dígitos al Iniciar Sesión y Botón Bloquear, Notificaciones de Bono y Kambio Yimmy con Cédula, Push Token, Recuperar Contraseña y Registro -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-analytics.js";
        import { getDatabase, ref, set, onValue, update, remove, push, runTransaction, get, child } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAee29RNZa3A-C-8APC1x_yMzViMgR7bBA",
            authDomain: "futuro-ahora.firebaseapp.com",
            databaseURL: "https://futuro-ahora-default-rtdb.firebaseio.com",
            projectId: "futuro-ahora",
            storageBucket: "futuro-ahora.firebasestorage.app",
            messagingSenderId: "727564715444",
            appId: "1:727564715444:web:0c4d66d7c2260daaeddee1",
            measurementId: "G-EDDTRWG6VV"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        window.fb = { db, ref, set, onValue, update, remove, push, runTransaction, get, child };

        const SESSION_STORAGE_KEY = 'futuro_persistent_session';
        const PIN_STORAGE_PREFIX = 'futuro_pin_';
        const SEEN_BONUS_PREFIX = 'futuro_seen_bonos_';
        const SEEN_NOTIF_PREFIX = 'futuro_seen_notifs_';
        const SEEN_RATES_PREFIX = 'futuro_last_rates_';
        const DEVICE_PUSH_ID_KEY = 'futuro_device_push_id';

        let ratesSnapshotInitialized = false;
        let currentPushToken = null;

        const COLOR_THEMES = {
            cyber: { name: 'Cyber Morado/Azul', swatch: 'from-violet-600 to-blue-600' },
            emerald: { name: 'Esmeralda Cian', swatch: 'from-emerald-500 to-cyan-500' },
            solar: { name: 'Solar Ámbar/Rosa', swatch: 'from-amber-500 to-pink-500' },
            ruby: { name: 'Rubí Violeta', swatch: 'from-rose-500 to-violet-600' },
            ocean: { name: 'Océano Índigo', swatch: 'from-sky-500 to-indigo-600' },
            neon: { name: 'Neón Fucsia/Cian', swatch: 'from-fuchsia-500 to-cyan-500' },
            gold: { name: 'Oro Naranja', swatch: 'from-yellow-400 to-orange-600' }
        };

        window.setColorTheme = function(themeKey) {
            if (!COLOR_THEMES[themeKey]) return;
            document.documentElement.setAttribute('data-theme', themeKey);
            localStorage.setItem('futuro_color_theme', themeKey);
            window.state.colorTheme = themeKey;
            window.showToast(`Tema aplicado: ${COLOR_THEMES[themeKey].name}`, 'info');
            window.render();
        };

        function getWorkerFirebaseRefKey(cedula) {
            if (!cedula) return cedula;
            const cleanSearch = cedula.trim().toUpperCase().replace(/-/g, '');
            if (window.state.workers[cedula]) return cedula;
            let foundKey = null;
            Object.entries(window.state.workers || {}).forEach(([key, w]) => {
                const dbCedula = w && w.cedula ? w.cedula.trim().toUpperCase().replace(/-/g, '') : '';
                if (key.toUpperCase().replace(/-/g, '') === cleanSearch || dbCedula === cleanSearch) {
                    foundKey = key;
                }
            });
            return foundKey || cedula;
        }

        function getActiveWorkerData() {
            if (!window.state.currentUser) return null;
            let cedula = window.state.currentUser.cedula;
            const workerKey = getWorkerFirebaseRefKey(cedula);
            if (window.state.workers[workerKey]) {
                return window.state.workers[workerKey];
            }
            return window.state.currentUser;
        }

        function getLocalNotificationsPlugin() {
            return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications
                ? window.Capacitor.Plugins.LocalNotifications
                : null;
        }

        function getPushNotificationsPlugin() {
            return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications
                ? window.Capacitor.Plugins.PushNotifications
                : null;
        }

        function getOrCreateDevicePushId() {
            let devId = localStorage.getItem(DEVICE_PUSH_ID_KEY);
            if (!devId) {
                devId = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem(DEVICE_PUSH_ID_KEY, devId);
            }
            return devId;
        }

        async function savePushTokenToFirebase(token) {
            if (!token) return;
            currentPushToken = token;

            const payloadBase = {
                token: token,
                plataforma: 'android',
                actualizadoEn: new Date().toISOString()
            };

            const activeWorker = window.state.currentUser && window.state.currentUser.role === 'worker'
                ? window.state.currentUser
                : null;

            if (activeWorker && activeWorker.cedula) {
                const cedulaMostrar = String(activeWorker.cedula).trim();
                const cleanCedula = cedulaMostrar.toUpperCase().replace(/-/g, '');
                const workerKey = getWorkerFirebaseRefKey(cleanCedula);

                set(ref(db, `pushTokens/${cleanCedula}`), {
                    ...payloadBase,
                    cedula: cedulaMostrar
                }).catch(() => {});

                if (window.state.workers && window.state.workers[workerKey]) {
                    update(ref(db, `workers/${workerKey}`), {
                        fcmToken: token
                    }).catch(() => {});
                }
            } else {
                const devId = getOrCreateDevicePushId();
                set(ref(db, `pushTokens/${devId}`), payloadBase).catch(() => {});
            }
        }

        let nativeNotifInitialized = false;

        async function solicitarPermisoPush() {
            if ("Notification" in window && Notification.permission !== "granted") {
                try {
                    await Notification.requestPermission();
                } catch (e) {}
            }

            const LocalNotifications = getLocalNotificationsPlugin();
            if (LocalNotifications && !nativeNotifInitialized) {
                nativeNotifInitialized = true;
                try {
                    const perm = await LocalNotifications.checkPermissions();
                    if (perm.display !== 'granted') {
                        await LocalNotifications.requestPermissions();
                    }
                    await LocalNotifications.addListener('localNotificationActionPerformed', (event) => {
                        const extra = event && event.notification && event.notification.extra ? event.notification.extra : {};
                        if (window.state.currentUser) {
                            workerTab = extra.targetTab || 'bonos';
                            window.state.view = 'workerDashboard';
                            window.render();
                        }
                    });
                } catch (e) {}
            }

            const PushNotifications = getPushNotificationsPlugin();
            if (PushNotifications && !window.__futuroPushRegistered) {
                window.__futuroPushRegistered = true;
                try {
                    let permStatus = await PushNotifications.checkPermissions();
                    if (permStatus.receive === 'prompt') {
                        permStatus = await PushNotifications.requestPermissions();
                    }
                    if (permStatus.receive === 'granted') {
                        await PushNotifications.register();
                    }

                    await PushNotifications.addListener('registration', (tokenObj) => {
                        if (tokenObj && tokenObj.value) {
                            savePushTokenToFirebase(tokenObj.value);
                        }
                    });

                    await PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
                        const data = action && action.notification && action.notification.data ? action.notification.data : {};
                        if (window.state.currentUser) {
                            workerTab = data.targetTab || (data.tipo === 'tasa' ? 'kambio' : 'bonos');
                            window.state.view = 'workerDashboard';
                            window.render();
                        }
                    });
                } catch (e) {}
            } else if (currentPushToken) {
                savePushTokenToFirebase(currentPushToken);
            }
        }

        async function lanzarPushNativo(titulo, mensaje, targetTab = 'bonos') {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(titulo, {
                        body: mensaje,

            const storageKey = SEEN_RATES_PREFIX + cleanCedula;
            const prevSignature = localStorage.getItem(storageKey);

                if (!prevSignature) {

        function checkNewBonusesForWorker(workerObj) {
            if (!workerObj || !workerObj.cedula) return;
            const cedulaMostrar = String(workerObj.cedula).trim();
            const cleanCedula = cedulaMostrar.toUpperCase().replace(/-/g, '');
            const bonos = workerObj.bonosAsignados || workerObj.bonos || {};
            const bonusKeys = Object.keys(bonos).filter(k => bonos[k] && typeof bonos[k] === 'object');

            const storageKey = SEEN_BONUS_PREFIX + cleanCedula;
            let seenKeys = [];
            try {
                seenKeys = JSON.parse(localStorage.getItem(storageKey) || '[]');
                if (!Array.isArray(seenKeys)) seenKeys = [];
            } catch (e) {
                seenKeys = [];
            }

            if (seenKeys.length === 0 && bonusKeys.length > 0) {
                localStorage.setItem(storageKey, JSON.stringify(bonusKeys));
                return;
            }

            const newBonusKeys = bonusKeys.filter(k => !seenKeys.includes(k));
            if (newBonusKeys.length > 0) {
                const updated = Array.from(new Set([...seenKeys, ...newBonusKeys]));
                localStorage.setItem(storageKey, JSON.stringify(updated));

                newBonusKeys.forEach(k => {
                    const b = bonos[k];
                    const nombreBono = b.nombre || 'Bono Corporativo';
                    const montoTexto = b.monto ? ` por ${parseFloat(b.monto).toLocaleString('es-VE', { minimumFractionDigits: 2 })} Bs.` : '';
                    const titulo = `Futuro Ahora • ¡Te llegó un bono!`;
                    const mensaje = `${nombreBono}${montoTexto}. Entra a la app para aceptarlo • CI: ${cedulaMostrar}`;
                    window.showToast(mensaje, 'success');
                    lanzarPushNativo(titulo, mensaje, 'bonos');
                });
            }
        }

        window.handleWithdraw = function(e, miCedula) {
            e.preventDefault();
            const workerKey = getWorkerFirebaseRefKey(miCedula);
            const worker = getActiveWorkerData();
            const monto = parseFloat(document.getElementById('montoRetiro').value.replace(/\./g, '').replace(',', '.'));
            const cuenta = document.getElementById('cuentaRetiroSelect').value;
            const concepto = document.getElementById('conceptoRetiro').value.trim();

            if (!cuenta || isNaN(monto) || monto <= 0) { window.showToast('Datos inválidos.', 'error'); return; }
            if ((worker.saldo || 0) < monto) { window.showToast('Saldo insuficiente.', 'error'); return; }

            worker.saldo -= monto;
            if (!worker.movimientos) worker.movimientos = [];
            worker.movimientos.unshift({
                id: 'mov_ret_' + Date.now(),
                descripcion: concepto ? concepto : `Retiro procesado a ${cuenta}`,
                destinoRetiro: cuenta,
                monto,
                tipo: 'retiro',
                fecha: new Date().toLocaleDateString(),
                referencia: 'REF-RET-' + Math.floor(Math.random() * 900000 + 100000)
            });

            const updates = {};
            updates[`workers/${workerKey}/saldo`] = worker.saldo;
            updates[`workers/${workerKey}/movimientos`] = worker.movimientos;

            window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
                document.getElementById('montoRetiro').value = '';
                document.getElementById('conceptoRetiro').value = '';
                window.showToast('Retiro procesado.', 'success');
                window.render();
            }).catch(err => window.showToast('Error: ' + err.message, 'error'));
        };

        window.handleTransferUser = function(e, miCedula, destCedulaParam = null) {
            if (e) e.preventDefault();
            const destinoCedula = destCedulaParam || document.getElementById('transferDestSelect').value;
            const montoRaw = document.getElementById(destCedulaParam ? 'transferMonto_' + destCedulaParam : 'transferMonto').value;
            const monto = parseFloat(montoRaw.replace(/\./g, '').replace(',', '.'));

            if (!destinoCedula || isNaN(monto) || monto <= 0) { window.showToast('Datos inválidos.', 'error'); return; }
            if (miCedula === destinoCedula) { window.showToast('No puedes transferirte a ti mismo.', 'error'); return; }

            const emisorKey = getWorkerFirebaseRefKey(miCedula);
            const receptorKey = getWorkerFirebaseRefKey(destinoCedula);
            const emisor = window.state.workers[emisorKey];
            const receptor = window.state.workers[receptorKey];

            if (!emisor || (emisor.saldo || 0) < monto) { window.showToast('Saldo insuficiente.', 'error'); return; }
            if (!receptor) { window.showToast('Destinatario no encontrado.', 'error'); return; }

            emisor.saldo -= monto;
            if (!emisor.movimientos) emisor.movimientos = [];
            emisor.movimientos.unshift({ id: 'mov_' + Date.now(), descripcion: `Transferencia enviada`, monto, tipo: 'transferencia_enviada', fecha: new Date().toLocaleDateString(), referencia: 'REF-TRF-' + Math.floor(Math.random() * 900000 + 100000) });

            receptor.saldo = (parseFloat(receptor.saldo) || 0) + monto;
            if (!receptor.movimientos) receptor.movimientos = [];
            receptor.movimientos.unshift({ id: 'mov_' + Date.now(), descripcion: `Transferencia recibida`, monto, tipo: 'transferencia_recibida', fecha: new Date().toLocaleDateString(), referencia: 'REF-TRF-' + Math.floor(Math.random() * 900000 + 100000) });

            const updates = {};
            updates[`workers/${emisorKey}/saldo`] = emisor.saldo;
            updates[`workers/${emisorKey}/movimientos`] = emisor.movimientos;
            updates[`workers/${receptorKey}/saldo`] = receptor.saldo;
            updates[`workers/${receptorKey}/movimientos`] = receptor.movimientos;

            window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
                window.showToast('Transferencia exitosa.', 'success');
                window.render();
            }).catch(err => window.showToast('Error: ' + err.message, 'error'));
        };

        function initWalletChart() {
            const canvas = document.getElementById('walletChart');
            if (!canvas) return;
            const w = getActiveWorkerData() || window.state.currentUser || {};
            const movimientos = w.movimientos || [];
            let totalIngresos = 0;
            let totalRetiros = 0;

            movimientos.forEach(m => {
                if (m.tipo === 'ingreso' || m.tipo === 'transferencia_recibida') totalIngresos += m.monto;
                else if (m.tipo === 'retiro' || m.tipo === 'transferencia_enviada') totalRetiros += m.monto;
            });

            if (totalIngresos === 0 && totalRetiros === 0) totalIngresos = 1;

            if (window.myWalletChartInstance instanceof Chart) {
                window.myWalletChartInstance.destroy();
            }

            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-primary').trim() || '#8b5cf6';
            const legendColor = document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#334155';

            window.myWalletChartInstance = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: ['Ingresos', 'Retiros'],
                    datasets: [{
                        data: [totalIngresos, totalRetiros],
                        backgroundColor: ['#10b981', primaryColor],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: legendColor, font: { size: 10, family: 'Inter', weight: 'bold' } } }
                    }
                }
            });
        }

        window.aceptarBono = function(cedula, bonoKey) {
            const workerKey = getWorkerFirebaseRefKey(cedula);
            const worker = getActiveWorkerData();

            if (!worker) {
                window.showToast('Error: No se encontró la sesión del trabajador.', 'error');
                return;
            }

            const bonos = worker.bonosAsignados || worker.bonos || {};
            if (!bonos[bonoKey]) {
                window.showToast('El bono no existe.', 'error');
                return;
            }

            if (bonos[bonoKey].aceptado) {
                window.showToast('Este bono ya ha sido aceptado anteriormente.', 'info');
                return;
            }

            bonos[bonoKey].aceptado = true;
            if (worker.bonosAsignados) worker.bonosAsignados = bonos;
            else worker.bonos = bonos;

            const montoBono = parseFloat(bonos[bonoKey].monto) || 0;
            const nombreBono = bonos[bonoKey].nombre || 'Bono';
            worker.saldo = (parseFloat(worker.saldo) || 0) + montoBono;

            if (!worker.movimientos) worker.movimientos = [];
            worker.movimientos.unshift({
                id: 'mov_' + Date.now(),
                descripcion: nombreBono,
                bonoNombre: nombreBono,
                monto: montoBono,
                tipo: 'ingreso',
                fecha: new Date().toLocaleDateString(),
                referencia: 'REF-BONO-' + Math.floor(Math.random() * 900000 + 100000)
            });

            const updates = {};
            updates[`workers/${workerKey}/bonosAsignados/${bonoKey}/aceptado`] = true;
            updates[`workers/${workerKey}/saldo`] = worker.saldo;
            updates[`workers/${workerKey}/movimientos`] = worker.movimientos;

            window.fb.update(window.fb.ref(window.fb.db), updates)
                .then(() => {
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
                    }
                    window.showToast('¡Bono acreditado en billetera con éxito!', 'success');

                })
                .catch((err) => {
                    console.error("Error al aceptar bono:", err);
                    window.showToast('Error al acreditar el bono: ' + err.message, 'error');
                });
        };

        function renderWorkerBonuses(workerObj) {
            const currentData = getActiveWorkerData() || workerObj;
            const bonos = (currentData && (currentData.bonosAsignados || currentData.bonos)) ? (currentData.bonosAsignados || currentData.bonos) : {};
            let html = `<div class="flex items-center justify-between mb-3 px-1"><h2 class="text-base font-black title-gradient">Bonificaciones</h2><span class="text-[9px] font-black uppercase tracking-widest theme-pill px-2.5 py-0.5 rounded-full">Beneficios</span></div><div class="space-y-4 pb-6">`;

            const esBonoBienvenida = (key, bono) => {
                const k = (key || '').toLowerCase();
                const n = (bono && bono.nombre ? bono.nombre : '').toLowerCase();
                return k === 'bono_bienvenida' || n.includes('bienvenida');
            };

            const keys = Object.keys(bonos).filter(k => bonos[k] && typeof bonos[k] === 'object').sort((a, b) => {
                const bonoA = bonos[a] || {};
                const bonoB = bonos[b] || {};
                const welcomeA = esBonoBienvenida(a, bonoA) ? 1 : 0;
                const welcomeB = esBonoBienvenida(b, bonoB) ? 1 : 0;
                if (welcomeA !== welcomeB) return welcomeA - welcomeB;

                const acceptedA = bonoA.aceptado === true ? 1 : 0;
                const acceptedB = bonoB.aceptado === true ? 1 : 0;
                if (acceptedA !== acceptedB) return acceptedA - acceptedB;

                return b.localeCompare(a);
            });

            if (keys.length === 0) {
                html += `<div class="glass-panel p-6 rounded-3xl text-center"><p class="opacity-70 text-xs">No tienes bonificaciones asignadas actualmente.</p></div>`;
            } else {
                keys.forEach(key => {
                    const b = bonos[key];
                    const isAccepted = b.aceptado === true;
                    html += `
                        <div class="glass-panel p-4 rounded-3xl shadow-2xl flex flex-col cyber-glow space-y-3">
                            ${b.imagen ? `
                                <div class="w-full bg-black/95 relative rounded-2xl overflow-hidden shadow-xl flex items-center justify-center">
                                    <img src="${b.imagen}" alt="${b.nombre || 'Bono'}" class="w-full h-auto max-h-[480px] object-contain rounded-xl">
                                </div>
                            ` : `
                                <div class="p-5 card-shimmer text-white rounded-2xl">
                                    <h3 class="font-black text-base">${b.nombre || 'Bono Corporativo'}</h3>
                                    <p class="text-[11px] opacity-85 mt-1 font-mono">Monto: ${b.monto ? b.monto.toLocaleString('es-VE', {minimumFractionDigits: 2}) : '0,00'} Bs.</p>
                                </div>
                            `}
                            ${!isAccepted ? `
                                <div class="pt-0.5">
                                    <button onclick="window.aceptarBono('${currentData.cedula}', '${key}')" class="w-full py-3.5 neon-gradient-btn font-black text-xs rounded-xl transition uppercase tracking-wider">ACEPTAR BONO</button>
                                </div>
                            ` : `<div class="text-center py-1.5 rounded-xl bg-emerald-500/15 text-emerald-500 dark:text-emerald-400 text-[10px] font-black uppercase">Acreditado en Billetera</div>`}
                        </div>
                    `;
                });
            }
            html += `</div>`;
            return html;
        }

            notifs.forEach(n => n.leida = true);
            window.fb.set(window.fb.ref(window.fb.db, 'notifications/' + cedula), notifs).then(() => window.render());
        };

        function renderWorkerNotifications(w) {
            const notifs = window.state.notifications[w.cedula] || [];
            return `
                <div class="space-y-4 pb-6">
                    <div class="flex justify-between items-center px-1"><h2 class="text-base font-black title-gradient">Notificaciones</h2>${notifs.length > 0 ? `<button onclick="window.marcarNotificacionesLeidas('${w.cedula}')" class="text-[11px] font-bold label-secondary hover:underline">Marcar leídas</button>` : ''}</div>
                    <div class="space-y-2.5">
                        ${notifs.length === 0 ? `<p class="opacity-70 text-xs px-1">No hay notificaciones.</p>` : notifs.map(n => `<div class="glass-panel p-4 rounded-2xl space-y-1 ${n.leida ? 'opacity-75' : 'ring-1 ring-current/30'}"><p class="font-black text-xs">${n.titulo}</p><p class="text-[11px] opacity-80">${n.mensaje}</p><span class="text-[9px] opacity-65 font-mono block">${n.fecha}</span></div>`).join('')}
                    </div>
                </div>
            `;
        }

        function renderWorkerProfile(w) {
            return `
                <div class="space-y-3.5 pb-6">
                    <h2 class="text-base font-black px-1 title-gradient">Perfil & Seguridad</h2>
                    <div class="glass-panel p-4 rounded-3xl shadow-xl cyber-glow-blue space-y-2">
                        <p class="text-[10px] font-extrabold uppercase tracking-wider label-secondary">Tema de Color</p>
                        ${renderThemeSelectorBar()}
                    </div>
                    <div class="glass-panel p-5 rounded-3xl shadow-xl cyber-glow space-y-2.5">
                        <h3 class="font-black text-xs label-primary uppercase">Cambiar PIN de 4 Dígitos</h3>
                        <form onsubmit="window.handleChangePin(event, '${w.cedula}')" class="space-y-2">
                            <input type="password" id="currentPinInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="PIN actual (4 dígitos)" class="w-full neon-input rounded-xl px-3 py-2 text-xs font-mono">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="password" id="newPinInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="Nuevo PIN" class="w-full neon-input rounded-xl px-3 py-2 text-xs font-mono">
                                <input type="password" id="confirmNewPinInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="Confirmar PIN" class="w-full neon-input rounded-xl px-3 py-2 text-xs font-mono">
                            </div>
                            <button type="submit" class="w-full py-2.5 neon-gradient-btn font-black text-xs rounded-xl">ACTUALIZAR PIN</button>
                        </form>
                    </div>
                    <div class="glass-panel p-5 rounded-3xl shadow-xl cyber-glow">
                        <form onsubmit="window.handleUpdateProfile(event, '${w.cedula}')" class="space-y-2.5">
                            <div><label class="text-[10px] label-primary uppercase font-bold">Cédula</label><input type="text" disabled value="${w.cedula}" class="w-full mt-1 neon-input opacity-70 rounded-xl px-3 py-2.5 text-xs font-mono"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] label-secondary uppercase font-bold">Nombre</label><input type="text" id="upNombre" value="${w.nombre}" required class="w-full mt-1 neon-input rounded-xl px-3 py-2.5 text-xs"></div>
                                <div><label class="text-[10px] label-primary uppercase font-bold">Apellido</label><input type="text" id="upApellido" value="${w.apellido}" required class="w-full mt-1 neon-input rounded-xl px-3 py-2.5 text-xs"></div>
                            </div>
                            <div><label class="text-[10px] label-secondary uppercase font-bold">Teléfono</label><input type="text" id="upTelefono" value="${w.telefono}" required class="w-full mt-1 neon-input rounded-xl px-3 py-2.5 text-xs"></div>
                            <div><label class="text-[10px] label-primary uppercase font-bold">Correo</label><input type="email" id="upEmail" value="${w.email}" required class="w-full mt-1 neon-input rounded-xl px-3 py-2.5 text-xs"></div>
                            <div><label class="text-[10px] label-secondary uppercase font-bold">Nueva Contraseña</label><input type="password" id="upPassword" minlength="6" placeholder="Dejar en blanco para mantener" class="w-full mt-1 neon-input rounded-xl px-3 py-2.5 text-xs"></div>
                            <button type="submit" class="w-full py-3.5 neon-gradient-btn font-black text-xs rounded-xl shadow-lg mt-1">GUARDAR CAMBIOS</button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleUpdateProfile = function(e, cedula) {
            e.preventDefault();
            const workerKey = getWorkerFirebaseRefKey(cedula);
            const worker = getActiveWorkerData();
            worker.nombre = document.getElementById('upNombre').value.trim();
            worker.apellido = document.getElementById('upApellido').value.trim();
            worker.telefono = document.getElementById('upTelefono').value.trim();
            worker.email = document.getElementById('upEmail').value.trim();
            const newPass = document.getElementById('upPassword').value;
            if (newPass) worker.password = newPass;
            window.fb.set(window.fb.ref(window.fb.db, 'workers/' + workerKey), worker).then(() => { window.showToast('Perfil actualizado.', 'success'); window.render(); });
        };

        initFirebaseListeners();
    </script>
</body>
</html>
